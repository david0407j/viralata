<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vira Lata Intervenções Artísticas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF4500;
            --secondary-color: #FF6B35;
            --accent-color: #FFA500;
            --dark-bg: #111;
            --darker-bg: #0a0a0a;
            --light-text: #fff;
            --lighter-text: rgba(255, 255, 255, 0.9);
            --medium-gray: #444;
            --dark-gray: #222;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #4CAF50;
            --transition-speed: 0.3s;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--light-text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .footer {
            background-color: var(--darker-bg);
            color: var(--light-text);
            padding: 100px 20px 50px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr;
            gap: 50px;
            justify-items: center;
            position: relative;
            overflow: hidden;
        }

        .footer-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 50px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-section {
            padding: 0 20px;
            position: relative;
        }

        .footer h2 {
            color: var(--primary-color);
            font-size: 2.4rem;
            margin-bottom: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Staatliches', cursive;
            position: relative;
            display: inline-block;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .footer h2::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(255, 69, 0, 0.3);
        }

        .contact-info {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 1.1rem;
            text-align: center;
        }

        .contact-info li {
            margin-bottom: 22px;
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            color: var(--lighter-text);
        }

        .contact-info i {
            margin-right: 15px;
            color: var(--primary-color);
            font-size: 1.4rem;
            min-width: 30px;
            text-align: center;
        }

        .contact-info a {
            color: var(--lighter-text);
            text-decoration: none;
            transition: all var(--transition-speed) ease;
            display: inline-block;
            position: relative;
        }

        .contact-info a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--primary-color);
            transition: width var(--transition-speed) ease;
        }

        .contact-info a:hover {
            color: var(--primary-color);
            transform: translateX(5px);
        }

        .contact-info a:hover::after {
            width: 100%;
        }

        .footer form {
            background-color: var(--dark-gray);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            transition: all var(--transition-speed) ease;
            border: 1px solid rgba(255, 69, 0, 0.1);
        }

        .footer form:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 69, 0, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--lighter-text);
            font-size: 1rem;
        }

        .footer form input,
        .footer form textarea,
        .footer form select {
            width: 100%;
            padding: 16px;
            margin-bottom: 5px;
            border: 1px solid var(--medium-gray);
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--light-text);
            font-size: 1rem;
            transition: all var(--transition-speed) ease;
            font-family: 'Poppins', sans-serif;
        }

        .footer form input::placeholder,
        .footer form textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .footer form input:focus,
        .footer form textarea:focus,
        .footer form select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 69, 0, 0.2);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .footer form button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: var(--light-text);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all var(--transition-speed) ease;
            margin-top: 15px;
            font-family: 'Staatliches', cursive;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .footer form button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }

        .footer form button:hover {
            background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(255, 69, 0, 0.5);
        }

        .footer form button:hover::before {
            left: 100%;
        }

        .footer form button:active {
            transform: translateY(0);
        }

        .social-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            margin: 40px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .social-icons a {
            color: var(--light-text);
            font-size: 1.8rem;
            text-decoration: none;
            transition: all var(--transition-speed) ease;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: var(--dark-gray);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .social-icons a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            opacity: 0;
            transition: opacity var(--transition-speed) ease;
            z-index: 0;
        }

        .social-icons a i {
            position: relative;
            z-index: 1;
        }

        .social-icons a:hover {
            color: var(--light-text);
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 8px 15px rgba(255, 69, 0, 0.4);
        }

        .social-icons a:hover::before {
            opacity: 1;
        }

        .copyright {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
            width: 100%;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.7;
        }

        .copyright-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .copyright-links a {
            color: var(--primary-color);
            text-decoration: none;
            transition: all var(--transition-speed) ease;
            position: relative;
            padding: 5px 0;
        }

        .copyright-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--primary-color);
            transition: width var(--transition-speed) ease;
        }

        .copyright-links a:hover {
            color: var(--accent-color);
        }

        .copyright-links a:hover::after {
            width: 100%;
        }

        .privacy-policy {
            font-size: 0.95rem;
            color: var(--lighter-text);
        }

        .privacy-policy input {
            width: auto;
            margin-right: 12px;
            accent-color: var(--primary-color);
        }

        .privacy-policy a {
            color: var(--primary-color);
            text-decoration: none;
            transition: all var(--transition-speed) ease;
            margin-left: 5px;
        }

        .privacy-policy a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        /* Efeito de onda decorativo */
        .wave-decoration {
            position: absolute;
            top: -1px;
            left: 0;
            width: 100%;
            height: 30px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" fill="%23FF4500" opacity=".25"/><path d="M0,0V15.81C13,36.92,27.64,56.86,47.69,72.05,99.41,111.27,165,111,224.58,91.58c31.15-10.15,60.09-26.07,89.67-39.8,40.92-19,84.73-46,130.83-49.67,36.26-2.85,70.9,9.42,98.6,31.56,31.77,25.39,62.32,62,103.63,73,40.44,10.79,81.35-6.69,119.13-24.28s75.16-39,116.92-43.05c59.73-5.85,113.28,22.88,168.9,38.84,30.2,8.66,59,6.17,87.09-7.5,22.43-10.89,48-26.93,60.65-49.24V0Z" fill="%23FF4500" opacity=".5"/><path d="M0,0V5.63C149.93,59,314.09,71.32,475.83,42.57c43-7.64,84.23-20.12,127.61-26.46,59-8.63,112.48,12.24,165.56,35.4C827.93,77.22,886,95.24,951.2,90c86.53-7,172.46-45.71,248.8-84.81V0Z" fill="%23FF4500"/></svg>') repeat-x;
            background-size: 1200px 100%;
        }

        /* Efeitos de partículas decorativas */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background-color: var(--primary-color);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        /* Responsividade */
        @media (max-width: 992px) {
            .footer-container {
                grid-template-columns: 1fr;
                max-width: 600px;
            }
            
            .footer-section {
                padding: 0;
            }

            .footer {
                padding: 80px 20px 40px;
            }
        }

        @media (max-width: 768px) {
            .footer {
                padding: 70px 20px 35px;
            }
            
            .footer h2 {
                font-size: 2rem;
            }
            
            .contact-info {
                font-size: 1.05rem;
            }
            
            .social-icons a {
                font-size: 1.6rem;
                width: 55px;
                height: 55px;
            }

            .footer form {
                padding: 25px;
            }
        }

        @media (max-width: 576px) {
            .footer {
                padding: 60px 15px 30px;
            }
            
            .footer h2 {
                font-size: 1.8rem;
            }
            
            .contact-info li {
                font-size: 1rem;
                flex-direction: row;
                text-align: left;
                justify-content: flex-start;
            }
            
            .contact-info i {
                margin-right: 12px;
                margin-bottom: 0;
            }
            
            .footer form {
                padding: 20px;
            }
            
            .footer form input,
            .footer form textarea,
            .footer form select {
                padding: 14px;
            }
            
            .footer form button {
                padding: 16px;
                font-size: 1.1rem;
            }

            .copyright-links {
                flex-direction: column;
                gap: 10px;
            }
        }

        /* Animação de confirmação */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .confirmation-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--success-color);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: none;
            animation: fadeIn 0.5s ease-out;
            font-weight: 600;
        }
    </style>
</head>
<body>
    
    <footer class="footer">
        <div class="wave-decoration"></div>
        <div class="particles" id="particles"></div>
        
        <div class="footer-container">
            <div class="footer-section">
                <h2>Contato</h2>
                <ul class="contact-info">
                    <li>
                        <i class="fas fa-envelope"></i>
                        <a href="mailto:contato@viralata.com.br">contato@viralata.com.br</a>
                    </li>
                    <li>
                        <i class="fas fa-phone-alt"></i>
                        <a href="tel:+5531986365346">+55 31 98636-5346</a>
                    </li>
                    <li>
                        <i class="fab fa-whatsapp"></i>
                        <a href="https://wa.me/5531986365346" target="_blank" aria-label="WhatsApp">
                            Fale Conosco no WhatsApp
                        </a>
                    </li>
                    <li>
                        <i class="fas fa-clock"></i>
                        Segunda a Sexta, das 9h às 18h
                    </li>
                    <li>
                        <i class="fas fa-map-marker-alt"></i>
                      
Contagem  , MG - Brasil
                    </li>
                </ul>
            </div>
             <section id="contato"></section>
            <div class="footer-section">
                <h2>Entre em Contato</h2>
                <form id="contactForm" onsubmit="sendMessage(event)">
                    <div class="form-group">
                        <label for="name">Nome:</label>
                        <input type="text" id="name" name="name" placeholder="Digite seu nome completo" autocomplete="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Telefone:</label>
                        <input type="tel" id="phone" name="phone" placeholder="(xx) xxxxx-xxxx" autocomplete="tel" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Assunto:</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Selecione um assunto</option>
                            <option value="Solicitar Orçamento">Solicitar Orçamento</option>
                            <option value="Informações Gerais">Informações Gerais</option>
                            <option value="Parcerias">Parcerias</option>
                            <option value="Trabalhe Conosco">Trabalhe Conosco</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Mensagem:</label>
                        <textarea id="message" name="message" rows="4" placeholder="Escreva sua mensagem" required></textarea>
                    </div>
                    
                    <div class="privacy-policy">
                        <input type="checkbox" id="privacy" name="privacy" required>
                        <label for="privacy">Li e aceito a <a href="">Política de Privacidade</a>.</label>
                    </div>
                    
                    <button type="submit" id="submitBtn">
                        <i class="fab fa-whatsapp" style="margin-right: 10px;"></i>
                        Enviar Mensagem
                    </button>
                </form>
            </div>
        </div>
        
        <div class="social-section">
            <div class="social-icons">
                <a href="https://www.facebook.com/VIRALATAProdutora/" target="_blank" title="Facebook" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/vira_lata_/" target="_blank" title="Instagram" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://br.linkedin.com/in/rafasaber/es" target="_blank" title="LinkedIn" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="https://wa.me/5531986365346" target="_blank" title="WhatsApp" aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
            
            <div class="copyright">
                &copy; <span id="current-year"></span> Vira Lata Intervenções Artísticas. Todos os direitos reservados.
                </div>
            </div>
        </div>
    </footer>

    <div class="confirmation-message" id="confirmationMessage">
        Mensagem enviada com sucesso! <i class="fas fa-check-circle" style="margin-left: 8px;"></i>
    </div>
    
    <script>
        // Atualiza o ano atual automaticamente
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Cria partículas decorativas
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Tamanho aleatório entre 3px e 8px
                const size = Math.random() * 5 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Posição aleatória
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // Atraso e duração da animação aleatórios
                const delay = Math.random() * 15;
                const duration = Math.random() * 10 + 10;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                
                // Opacidade aleatória
                particle.style.opacity = Math.random() * 0.2 + 0.05;
                
                particlesContainer.appendChild(particle);
            }
        }

        // Função para enviar mensagem
        function sendMessage(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            // Verifica se o checkbox de privacidade foi marcado
            if (!document.getElementById('privacy').checked) {
                showConfirmation('Por favor, aceite a política de privacidade antes de enviar.', false);
                return;
            }

            // Validação básica do telefone
            const phone = formData.get('phone');
            if (!/^\(\d{2}\) \d{4,5}-\d{4}$/.test(phone)) {
                showConfirmation('Por favor, insira um telefone válido no formato (xx) xxxxx-xxxx.', false);
                return;
            }

            const message = `
                *Nova mensagem do site Vira Lata:*
                
                *Nome:* ${formData.get('name')}
                *E-mail:* ${formData.get('email')}
                *Telefone:* ${formData.get('phone')}
                *Assunto:* ${formData.get('subject')}
                
                *Mensagem:*
                ${formData.get('message')}
            `;

            const whatsappURL = `https://wa.me/5531986365346?text=${encodeURIComponent(message)}`;
            window.open(whatsappURL, '_blank');
            
            // Feedback visual
            const button = form.querySelector('button');
            button.innerHTML = '<i class="fas fa-check" style="margin-right: 10px;"></i> Mensagem Enviada!';
            button.style.background = 'linear-gradient(135deg, var(--success-color), #45a049)';
            button.disabled = true;
            
            // Mostra mensagem de confirmação
            showConfirmation('Mensagem enviada com sucesso!', true);
            
            // Limpa o formulário após o envio
            setTimeout(() => {
                form.reset();
                button.innerHTML = '<i class="fab fa-whatsapp" style="margin-right: 10px;"></i> Enviar Mensagem';
                button.style.background = '';
                button.disabled = false;
            }, 3000);
        }

        // Mostra mensagem de confirmação
        function showConfirmation(message, isSuccess) {
            const confirmation = document.getElementById('confirmationMessage');
            confirmation.textContent = message;
            confirmation.style.backgroundColor = isSuccess ? 'var(--success-color)' : 'var(--primary-color)';
            confirmation.style.display = 'flex';
            confirmation.style.alignItems = 'center';
            
            setTimeout(() => {
                confirmation.style.display = 'none';
            }, 5000);
        }

        // Mascara para o telefone
        function phoneMask(input) {
            let value = input.value.replace(/\D/g, '');
            
            if (value.length > 0) {
                value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
            }
            if (value.length > 10) {
                value = value.replace(/(\d{5})(\d)/, '$1-$2');
            } else if (value.length > 9) {
                value = value.replace(/(\d{4})(\d)/, '$1-$2');
            }
            
            input.value = value.substring(0, 15);
        }

        // Adiciona máscara ao campo de telefone
        document.getElementById('phone').addEventListener('input', function(e) {
            phoneMask(e.target);
        });

        // Cria as partículas quando a página carrega
        window.addEventListener('DOMContentLoaded', createParticles);
    </script>
</body>
</html>
